name: Deploy Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to apply pending migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_ID }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Confirm production deployment
        run: |
          if [ "${{ inputs.confirmation }}" != "deploy-production" ]; then
            echo "::error::confirmation must be deploy-production"
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Required Supabase deployment credentials are missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Verify migration history
        run: supabase migration list --linked
